services:
  emby:
    image: linuxserver/emby:latest
    container_name: emby
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Montevideo
    volumes:
      - /home/damian/docker/emby/config:/config
      - /home/damian/docker/emby/cache:/cache
      - /srv/data/media:/media
      - type: bind
        source: /mnt/toshiba
        target: /media-toshiba
        read_only: true
        bind:
          propagation: rslave
    ports:
      - "8096:8096"
