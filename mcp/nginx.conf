events {}

http {
  map_hash_bucket_size 128;

  # Add new tokens here as you add more MCP clients
  map $http_authorization $mcp_auth_ok {
    "Bearer DPeEexgHjIdpSk2usqzdMPJn2i4+ONjVFQeRHmxywvw=" 1;
    default 0;
  }

  server {
    listen 4781;

    # Gateway health check — no auth required
    location = /health {
      return 200 '{"status":"ok"}';
      add_header Content-Type application/json;
    }

    location = /n8n {
      if ($mcp_auth_ok = 0) {
        return 401 '{"error":"Unauthorized"}';
      }
      proxy_pass         http://mcp-server:3000/n8n/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_buffering    off;
      proxy_read_timeout 300s;
    }

    location = /wikipedia {
      if ($mcp_auth_ok = 0) {
        return 401 '{"error":"Unauthorized"}';
      }
      proxy_pass         http://mcp-server:3000/wikipedia/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_buffering    off;
      proxy_read_timeout 300s;
    }

    # Google Drive — one regex location covers all /google-<account> endpoints
    location ~ ^/google-([^/]+)/?$ {
      if ($mcp_auth_ok = 0) {
        return 401 '{"error":"Unauthorized"}';
      }
      proxy_pass         http://mcp-server:3000/google-$1/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_buffering    off;
      proxy_read_timeout 300s;
    }
  }
}
