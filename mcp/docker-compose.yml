services:
  mcp-router:
    image: nginx:alpine
    container_name: mcp-router
    restart: unless-stopped
    ports:
      - "4781:4781"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - services_shared
    depends_on:
      - mcp-server

  mcp-server:
    build: ./mcp-server
    container_name: mcp-server
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - N8N_API_URL=https://n8n.damianferencz.org/api/v1
      - N8N_API_KEY=${N8N_MCP_API_KEY}
      - GOOGLE_ACCOUNTS=${GOOGLE_ACCOUNTS:-}
      - GOOGLE_CREDS_DIR=/run/secrets/google
    volumes:
      - ./credentials:/run/secrets/google:ro
    networks:
      - services_shared

networks:
  services_shared:
    external: true
    name: services_shared
