# Hermes Agent (personal assistant on Telegram) — https://github.com/damif94/hermes
# The image (persona, first-boot config, custom skills) is built by that repo's CI
# (ghcr.io, private); this file only runs it and passes the secrets from ../.env.
services:
  hermes:
    image: ghcr.io/damif94/hermes:latest
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      - TZ=${TZ:-America/Montevideo}
      - HERMES_TIMEZONE=${TZ:-America/Montevideo}
      # s6 remaps the internal hermes user to damian so /srv/data/hermes stays ours
      - HERMES_UID=1000
      - HERMES_GID=1000
      # Key from the dedicated "hermes" workspace in the Console
      - ANTHROPIC_API_KEY=${HERMES_ANTHROPIC_API_KEY:?set HERMES_ANTHROPIC_API_KEY in .env}
      # Dedicated bot (@DamiPersonalAssistantBot): long polling, so no port/UFW rule
      - TELEGRAM_BOT_TOKEN=${HERMES_TELEGRAM_BOT_TOKEN:?set HERMES_TELEGRAM_BOT_TOKEN in .env}
      - TELEGRAM_ALLOWED_USERS=${HERMES_TELEGRAM_ALLOWED_USERS:?set HERMES_TELEGRAM_ALLOWED_USERS in .env}
      # Dashboard: http://192.168.0.100:9119 (LAN + WireGuard; the router doesn't forward it).
      # Binding beyond loopback makes Hermes require a login; it refuses to start otherwise.
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER:-damian}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:?set HERMES_DASHBOARD_PASSWORD in .env}
      # Keeps dashboard sessions valid across restarts
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_SECRET:?set HERMES_DASHBOARD_SECRET in .env}
    volumes:
      # All agent state: config.yaml, SOUL.md, memories, skills, cron, sessions
      - /srv/data/hermes:/opt/data
      # Read-only file access for the agent
      - /srv/data/media:/files/media:ro
      # Long form so the container follows host remounts of the USB drive (see emby/samba)
      - type: bind
        source: /mnt/toshiba
        target: /files/toshiba
        read_only: true
        bind:
          propagation: rslave
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
    # Dashboard only; Telegram is outbound long polling
    ports:
      - "192.168.0.100:9119:9119"
    labels:
      # Rolls out every push to the hermes repo. Upgrading Hermes itself is a deliberate
      # FROM bump there (it migrates /srv/data/hermes; back it up first).
      - com.centurylinklabs.watchtower.enable=true
