services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.forwarding=1
    ports:
      - "51820:51820/udp"
    environment:
      - WG_HOST=${WG_HOST}
      - WG_PORT=51820
      - PORT=51821
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_DEFAULT_DNS=1.1.1.1
      - WG_ALLOWED_IPS=0.0.0.0/0, ::/0
      - LANG=en
      - INSECURE=true
      - GENERIC_TIMEZONE=${TIMEZONE:-America/Montevideo}
    volumes:
      - /srv/data/wg-easy:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    networks:
      - services_shared

networks:
  services_shared:
    external: true
    name: services_shared
