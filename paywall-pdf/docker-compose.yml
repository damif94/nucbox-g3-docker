services:
  paywall-pdf:
    build: .
    image: paywall-pdf:local
    container_name: paywall-pdf
    restart: unless-stopped
    environment:
      # Falls back to the shared homelab bot token if no dedicated one is set.
      - PAYWALL_BOT_TOKEN=${PAYWALL_BOT_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - PAYWALL_ALLOWED_CHAT_IDS=${PAYWALL_ALLOWED_CHAT_IDS:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TZ=${TZ:-America/Montevideo}
      - LOCALE=${PAYWALL_LOCALE:-es-UY}
      # Default PDF paper: iphone (13 mini screen), a4, a5, a6, letter, legal.
      # Any request can override it: /pdf a4 <link>
      - PDF_PAGE=${PAYWALL_PDF_PAGE:-iphone}
      # Output for a bare link: 'pdf' (phone-sized) or 'epub'
      - DEFAULT_FORMAT=${PAYWALL_DEFAULT_FORMAT:-pdf}
    volumes:
      # Chrome profile: keeps extension state and any site logins across restarts
      - /srv/data/paywall-pdf/profile:/data/profile
      # Unpacked extension: refreshed in place by /update, no rebuild needed
      - /srv/data/paywall-pdf/extension:/data/extension
      - /srv/data/paywall-pdf/debug:/data/debug
    # Chromium crashes with the default 64 MB /dev/shm
    shm_size: 1gb
    mem_limit: 3g
    labels:
      # Locally built image, nothing for watchtower to pull
      - com.centurylinklabs.watchtower.enable=false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
