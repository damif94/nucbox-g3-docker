<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>damianferencz.org</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>">

  <!--
    One page, two views, picked from the hostname it was opened on:
      - *.damianferencz.org  → public view: only what NPM exposes on the internet, https links.
      - anything else (192.168.0.100, localhost, VPN) → local view: every service on its host port.
    Both NPM's default site (LAN, port 80) and the `landing` container (damianferencz.org)
    serve this same directory, so there is nothing to keep in sync.
    `?view=public` / `?view=local` forces a view.
  -->

  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --card: #f1f3f6;
      --card-hover: #e6e9ef;
      --border: #e2e5ea;
      --text: #111827;
      --muted: #6b7280;
      --accent: #0284c7;
      --ok: #16a34a;
      --down: #dc2626;
      --unknown: #9ca3af;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --panel: #111a2e;
        --card: #18233a;
        --card-hover: #1f2d4a;
        --border: #1f2a40;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --ok: #4ade80;
        --down: #f87171;
        --unknown: #64748b;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.5rem 16px 2rem;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    h1 { margin: 0 0 0.25rem; font-size: 1.9rem; letter-spacing: -0.02em; }

    .subtitle { margin: 0; color: var(--muted); }

    .switch {
      display: inline-flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
    }

    .switch a {
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
    }

    .switch a.active { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / 0.15); }

    .section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.25rem 1.25rem;
      margin-bottom: 1.25rem;
    }

    .section h2 {
      margin: 0 0 0.9rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.6rem;
    }

    .card {
      display: flex;
      gap: 0.7rem;
      align-items: flex-start;
      padding: 0.75rem 0.85rem;
      background: var(--card);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      min-width: 0;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    a.card:hover { background: var(--card-hover); transform: translateY(-1px); }

    .icon { font-size: 1.3rem; line-height: 1.2; flex: none; }

    .body { min-width: 0; flex: 1; }

    .name { display: flex; align-items: center; gap: 0.4rem; font-weight: 600; }

    .desc { color: var(--muted); font-size: 0.85rem; margin-top: 0.1rem; }

    .addr {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      margin-top: 0.3rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--unknown);
      flex: none;
    }

    .dot.ok { background: var(--ok); }
    .dot.down { background: var(--down); }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>damianferencz.org</h1>
        <p class="subtitle" id="subtitle">Servicios self-hosted</p>
      </div>
      <nav class="switch" aria-label="Vista">
        <a href="?view=public" data-view="public">Pública</a>
        <a href="?view=local" data-view="local">Local</a>
      </nav>
    </header>

    <main id="sections">
      <noscript><p>Esta página necesita JavaScript para listar los servicios.</p></noscript>
    </main>

    <footer>NucBox G3 Plus · Ubuntu 24.04 · Docker · Nginx Proxy Manager</footer>
  </div>

  <script>
    const DOMAIN = 'damianferencz.org';

    // public: full URL reachable from the internet (omit if NPM doesn't expose it).
    // local:  port on the box, or a full URL for things that aren't http on a port.
    // probe:  false for links whose status can't be checked from the browser.
    // link:   false for addresses that only make sense copied into a client.
    const SECTIONS = [
      {
        title: 'Apps',
        services: [
          { name: 'Portfolio', icon: '📈', desc: 'Dashboard de inversiones', public: `https://${DOMAIN}/portfolio/`, local: `https://${DOMAIN}/portfolio/` },
          { name: 'Edifica', icon: '🏢', desc: 'Administración de edificios', public: `https://${DOMAIN}/edifica/`, local: `https://${DOMAIN}/edifica/` },
          { name: 'Ateneo Médico', icon: '🩺', desc: 'Ateneo médico', public: `https://${DOMAIN}/ateneo-medico/`, local: `https://${DOMAIN}/ateneo-medico/` },
        ],
      },
      {
        title: 'Media',
        services: [
          { name: 'Emby', icon: '🎬', desc: 'Streaming de media', public: `https://emby.${DOMAIN}`, local: 8096 },
          { name: 'MeTube', icon: '▶️', desc: 'Descargas de YouTube', public: `https://metatube.${DOMAIN}`, local: 8081 },
          { name: 'Tdarr', icon: '🎞️', desc: 'Transcoding', local: 8265 },
          { name: 'Samba', icon: '🗄️', desc: 'Share del disco Toshiba', local: 'smb://192.168.0.100/toshiba', probe: false },
        ],
      },
      {
        title: 'Descargas',
        services: [
          { name: 'Radarr', icon: '🎥', desc: 'Películas', public: `https://radarr.${DOMAIN}`, local: 7878 },
          { name: 'Sonarr', icon: '📺', desc: 'Series', public: `https://sonarr.${DOMAIN}`, local: 8989 },
          { name: 'Bazarr', icon: '💬', desc: 'Subtítulos', public: `https://bazarr.${DOMAIN}`, local: 6767 },
          { name: 'Prowlarr', icon: '🔎', desc: 'Indexers', local: 9696 },
          { name: 'qBittorrent', icon: '🧲', desc: 'Cliente torrent', local: 8080 },
        ],
      },
      {
        title: 'Automatización y asistentes',
        services: [
          { name: 'n8n', icon: '⚙️', desc: 'Workflows', public: `https://n8n.${DOMAIN}`, local: 5678 },
          { name: 'Evolution API', icon: '📱', desc: 'WhatsApp API', public: `https://evolution-api.${DOMAIN}/manager`, local: '8088/manager' },
          { name: 'Hermes', icon: '🤖', desc: 'Asistente personal (Telegram)', public: 'https://t.me/DamiPersonalAssistantBot', local: 'https://t.me/DamiPersonalAssistantBot', probe: false },
          { name: 'Hermes dashboard', icon: '🧭', desc: 'Panel del asistente', local: 9119 },
          { name: 'Paywall bot', icon: '📰', desc: 'Link → EPUB (Telegram)', public: 'https://t.me/DamiPaywallBot', local: 'https://t.me/DamiPaywallBot', probe: false },
          { name: 'MCP Gateway', icon: '🔌', desc: 'Endpoint MCP', public: `https://mcp.${DOMAIN}`, local: 4781, probe: false },
        ],
      },
      {
        title: 'Infraestructura',
        services: [
          { name: 'Portainer', icon: '🐳', desc: 'Gestión de Docker', local: 9000 },
          { name: 'Nginx Proxy Manager', icon: '🔀', desc: 'Reverse proxy y SSL', local: 81 },
          { name: 'WireGuard', icon: '🔐', desc: 'VPN (wg-easy)', public: `https://vpn.${DOMAIN}`, local: `https://vpn.${DOMAIN}` },
          { name: 'Mailpit', icon: '✉️', desc: 'Mail de Edifica', local: 8025 },
          { name: 'PostgreSQL', icon: '🐘', desc: 'Base compartida', local: 'postgres://192.168.0.100:5432', probe: false, link: false },
        ],
      },
    ];

    function pickView() {
      const forced = new URLSearchParams(location.search).get('view');
      if (forced === 'public' || forced === 'local') return forced;
      const host = location.hostname;
      return host === DOMAIN || host.endsWith('.' + DOMAIN) ? 'public' : 'local';
    }

    // Local links reuse the host the page was opened on, so they work over the
    // VPN or via localhost as well as on 192.168.0.100.
    function localUrl(local) {
      if (typeof local === 'string' && local.includes('://')) return local;
      const host = location.hostname.endsWith(DOMAIN) ? '192.168.0.100' : location.hostname;
      return `http://${host}:${local}`;
    }

    function el(tag, attrs, ...children) {
      const node = document.createElement(tag);
      Object.assign(node, attrs);
      node.append(...children);
      return node;
    }

    // A no-cors fetch resolves with an opaque response when something answered,
    // and rejects when nothing did. Good enough for an up/down dot.
    function probe(url, dot) {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 5000);
      fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctl.signal })
        .then(() => { dot.className = 'dot ok'; dot.title = 'Responde'; })
        .catch(() => { dot.className = 'dot down'; dot.title = 'Sin respuesta'; })
        .finally(() => clearTimeout(timer));
    }

    function render(view) {
      document.querySelectorAll('.switch a').forEach(a => a.classList.toggle('active', a.dataset.view === view));
      document.getElementById('subtitle').textContent = view === 'public'
        ? 'Servicios self-hosted · accesibles desde internet'
        : 'Servicios self-hosted · red local / VPN';

      const main = document.getElementById('sections');
      main.replaceChildren();

      for (const section of SECTIONS) {
        const services = section.services.filter(s => view === 'local' || s.public);
        if (!services.length) continue;

        const grid = el('div', { className: 'grid' });
        for (const s of services) {
          const url = view === 'public' ? s.public : localUrl(s.local);
          const shown = url.replace(/^https?:\/\//, '').replace(/\/$/, '');
          const dot = el('span', { className: 'dot', title: 'Sin verificar' });
          const isLink = s.link !== false;

          grid.append(el(isLink ? 'a' : 'div',
            !isLink ? { className: 'card', title: url } : { className: 'card', href: url, target: '_blank', rel: 'noopener' },
            el('span', { className: 'icon' }, s.icon),
            el('div', { className: 'body' },
              el('div', { className: 'name' }, s.name, ...(s.probe === false ? [] : [dot])),
              el('div', { className: 'desc' }, s.desc),
              el('div', { className: 'addr' }, shown),
            ),
          ));

          if (s.probe !== false && url.startsWith('http')) probe(url, dot);
        }

        main.append(el('section', { className: 'section' }, el('h2', {}, section.title), grid));
      }
    }

    render(pickView());
  </script>
</body>
</html>
